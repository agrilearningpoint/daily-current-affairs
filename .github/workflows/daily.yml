name: Daily News Pipeline

on:
  schedule:
    # GitHub cron is best-effort (2026-11-03: the 04:05 IST cron fired at 09:09 IST),
    # so several idempotent triggers are used. Every run resolves the same IST
    # edition date, resumes from checkpoints, and a completed edition is a no-op.
    # Generation (02:00-04:00 IST). Stage 22 is gated by ALP_PUBLISH_NOT_BEFORE,
    # so an early finish parks the job as "awaiting_publish" (green run).
    - cron: "30 20 * * *"   # 02:00 IST
    - cron: "0 21 * * *"    # 02:30 IST
    - cron: "30 21 * * *"   # 03:00 IST
    - cron: "30 22 * * *"   # 04:00 IST
    # Publish window (06:00-06:40 IST): resumes the parked edition and sends it;
    # also generates from scratch if every earlier trigger was dropped.
    - cron: "30 0 * * *"    # 06:00 IST
    - cron: "50 0 * * *"    # 06:20 IST
    - cron: "10 1 * * *"    # 06:40 IST
    # Optional exact-time trigger: docs/scheduling.md (cron-job.org -> workflow_dispatch).
  workflow_dispatch:
    inputs:
      date:
        description: "Override date (YYYY-MM-DD). Default: today IST."
        required: false
        type: string
      allow_revision:
        description: 'Explicitly approve publishing a corrected PDF for an already-published edition (does not override uncertain sends)'
        required: false
        type: boolean
        default: false
      allow_fallback:
        description: 'Development preview only: allow dictionary fallback (production remains strict)'
        required: false
        type: boolean
        default: false
      reset:
        description: "Reset job state and re-run from scratch?"
        required: false
        type: boolean
        default: false
      debug:
        description: "Enable debug logging?"
        required: false
        type: boolean
        default: false

# One repo-wide group: daily/weekly/monthly/watchdog all commit to the same
# git-tracked state files (state/jobs.json, ledgers), so they must not run
# concurrently and race on those commits.
concurrency:
  group: current-affairs-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  PYTHON_VERSION: "3.11"
  ALP_STAGE_TIMEOUT: "900"
  ALP_MAX_RETRIES: "2"
  LOG_LEVEL: ${{ github.event.inputs.debug == 'true' && 'DEBUG' || 'INFO' }}
  # --- PDF content policy (single documented source: docs/pdf-design.md) -------
  # A production daily edition is a complete study pack, not a short update.
  # The hard QA range prevents both thin and unreasonably long PDFs.
  PDF_QA_TARGET_PAGES: "15"
  PDF_QA_MIN_PAGES: "15"
  PDF_QA_MAX_PAGES: "45"
  ALP_MIN_DAILY_NEWS: "15"
  # Fifteen high-value stories produce a complete 15-45 page study pack while
  # keeping strict AI Hindi translation within free-tier rate limits.
  ALP_TARGET_NEWS_COUNT: "15"
  # Source sentences are already edited deterministically; avoid unnecessary
  # AI polishing calls so free models are reserved for Hindi translations.
  ALP_DISABLE_POLISH: "1"
  PDF_QA_SUBSTANTIVE_CHARS: "600"
  PDF_QA_NEAR_EMPTY_CHARS: "260"
  # --- Schedule policy (docs/scheduling.md) -------------------------------------
  # Telegram publish (stage 22) never sends before this IST time on the edition
  # date. Earlier finishes end green as "awaiting_publish"; later = send ASAP.
  ALP_PUBLISH_NOT_BEFORE: "06:00"
  # Daily news window is fixed to the edition date: previous day 06:00 IST ->
  # edition day 06:00 IST (clipped to run time when generating earlier, and
  # starting at the previous edition's recorded end so editions never overlap).
  ALP_DAILY_CUTOFF: "06:00"

jobs:
  run-daily:
    name: Run Daily Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh committed state to latest main
        # A trigger that waited in the concurrency queue checks out the commit it
        # was created at; pull the newest state/ so it sees the earlier run's
        # checkpoint reference / awaiting_publish status instead of stale state.
        run: |
          git fetch --depth=1 origin "${{ github.ref_name }}"
          git checkout FETCH_HEAD -- state/ || echo "state refresh skipped"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Hindi shaping runtime
        run: sudo apt-get update && sudo apt-get install -y libraqm0 libraqm-dev libfribidi0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Prepare directories
        run: |
          mkdir -p logs state/locks state/metrics \
                   data/raw data/verified data/jobs data/dedup \
                   data/scored data/selected data/content data/mcq \
                   data/memory output

      - name: Resolve edition and previous checkpoint run
        id: edition
        env:
          REQUESTED_DATE: ${{ github.event.inputs.date }}
          RESET_REQUEST: ${{ github.event.inputs.reset }}
          REVISION_REQUEST: ${{ github.event.inputs.allow_revision }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, date
          from pathlib import Path
          from zoneinfo import ZoneInfo
          value = os.environ.get("REQUESTED_DATE", "").strip() or datetime.now(ZoneInfo("Asia/Kolkata")).strftime("%Y-%m-%d")
          date.fromisoformat(value)
          job_id = f"daily_{value}"
          data = json.loads(Path("state/jobs.json").read_text()) if Path("state/jobs.json").exists() else {}
          job = data.get("jobs", data).get(job_id, {})
          run_id = str(job.get("checkpoint_run_id") or job.get("github_run_id", ""))
          with open(os.environ["GITHUB_ENV"], "a") as handle:
              handle.write(f"EDITION_DATE={value}\n")
          # Backup crons: once today's edition is published, later triggers are
          # no-ops (no artifact restore, no pipeline run, nothing to break).
          ledger = json.loads(Path("state/published_events.json").read_text()) if Path("state/published_events.json").exists() else {}
          records = ledger.get("records", {}) if isinstance(ledger, dict) else {}
          published = job.get("status") == "success" and any(
              isinstance(r, dict) and r.get("job_id") == job_id and r.get("status") == "success"
              for r in (records.values() if isinstance(records, dict) else records))
          explicit = os.environ.get("RESET_REQUEST") == "true" or os.environ.get("REVISION_REQUEST") == "true"
          skip = published and not explicit
          if skip:
              print(f"{job_id} is already published to Telegram; nothing to do for this trigger.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"previous_run={run_id if run_id.isdigit() else ''}\n")
              handle.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - name: Restore prior edition checkpoints
        if: steps.edition.outputs.skip != 'true' && steps.edition.outputs.previous_run != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pipeline-checkpoints
          run-id: ${{ steps.edition.outputs.previous_run }}
          github-token: ${{ github.token }}
          path: .

      - name: Persist start marker for hard-interruption recovery
        if: steps.edition.outputs.skip != 'true'
        env:
          STATE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import os
          from main import job_context_env, load_jobs_state, update_job, STAGES_BY_TYPE, ROOT
          from pipeline.checkpoints import resume_after
          ctx = job_context_env("daily", os.environ["EDITION_DATE"])
          job = load_jobs_state(strict=True).get(ctx["ALP_JOB_ID"], {})
          names = [stage[0] for stage in STAGES_BY_TYPE["daily"]]
          if job.get("status") != "success" or resume_after(ROOT, ctx["ALP_JOB_ID"], job, names) != names[-1]:
              if job.get("window", {}).get("start") and job.get("window", {}).get("end"):
                  ctx["ALP_WINDOW_START"] = job["window"]["start"]
                  ctx["ALP_WINDOW_END"] = job["window"]["end"]
              update_job(ctx["ALP_JOB_ID"], status="running", context=ctx, record_attempt=False)
          PY
          python scripts/sync_state.py --branch "$STATE_BRANCH" --message "state: daily started"

      - name: Run daily pipeline
        id: pipeline
        if: steps.edition.outputs.skip != 'true'
        env:
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          EDITION_DATE: ${{ env.EDITION_DATE }}
          RESET_REQUEST: ${{ github.event.inputs.reset }}
          MIN_CONFIDENCE_THRESHOLD: "0.3"
          MIN_VERIFIED_COUNT: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          # Model for the generic-compatible provider / translator fallback.
          ALP_LLM: ${{ vars.LLM_MODEL || 'auto' }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # --- discovery + aux AI keys (added 2026-11-03; all live-verified) ---
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          LL7_API_KEY: ${{ secrets.LL7_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # Free-tier extras (each stays off unless its secret exists).
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_MODEL: ${{ vars.POLLINATIONS_MODEL || 'auto' }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          SILICONFLOW_MODEL: ${{ vars.SILICONFLOW_MODEL || 'auto' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'auto' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'auto' }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'auto' }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL || 'auto' }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL || 'auto' }}
          # "auto" = provider catalogue se live free model khud chuna jaata hai (pipeline/ai_router.py)
          ALP_MODEL_AUTO_DISCOVERY: "1"
          ALP_TRANSLATION_WAIT_BUDGET: "300"
          ALP_ALLOW_EDITION_REVISION: ${{ github.event.inputs.allow_revision == 'true' && '1' || '0' }}
          # Scheduled runs have no inputs -> '0' (strict). Only an explicit dispatch opts in.
          ALP_ALLOW_FALLBACK_TRANSLATION: ${{ github.event.inputs.allow_fallback == 'true' && '1' || '0' }}
          PDF_QA_MIN_HINDI_PCT: "3.0"
        run: |
          ARGS=(--job-type daily --date "$EDITION_DATE")
          if [ "$RESET_REQUEST" = "true" ]; then ARGS+=(--reset); fi
          python main.py "${ARGS[@]}"

      - name: Run summary (counts + AI providers)
        if: always() && steps.edition.outputs.skip != 'true'
        run: python scripts/run_summary.py --job-id "daily_${EDITION_DATE}"

      - name: Save edition checkpoints (always)
        id: checkpoint_upload
        if: always() && steps.edition.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-checkpoints
          path: |
            data/
            output/
            logs/qa/
            logs/ai_usage.jsonl
            logs/stages/
          retention-days: 30
          overwrite: true
          if-no-files-found: warn

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-logs-${{ github.run_id }}
          path: |
            logs/
            state/metrics/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-state-${{ github.run_id }}
          path: |
            state/jobs.json
            recovery_plan.json
            output/
            data/
          retention-days: 30
          if-no-files-found: warn

      # --------------------------------------------------------------------- #
      # Conflict-safe state commit
      # --------------------------------------------------------------------- #
      - name: Record uploaded checkpoint reference
        if: always() && steps.checkpoint_upload.outputs.artifact-id != ''
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from main import load_jobs_state, save_jobs_state, JOBS_STATE_PATH
          from pipeline.persistence import file_lock
          job_id = "daily_" + os.environ["EDITION_DATE"]
          with file_lock(JOBS_STATE_PATH.parent / "locks" / "state.lock"):
              jobs = load_jobs_state(strict=True)
              if job_id in jobs:
                  jobs[job_id]["checkpoint_run_id"] = os.environ["GITHUB_RUN_ID"]
                  jobs[job_id]["updated_at"] = datetime.now(timezone.utc).isoformat()
                  save_jobs_state(jobs)
          PY

      - name: Commit state changes
        if: always() && steps.edition.outputs.skip != 'true'
        env:
          STATE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/sync_state.py --branch "$STATE_BRANCH" --message "state: daily checkpoint"

      - name: Alert admin on failure (Telegram DM)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: python scripts/alert_failure.py --job-id "daily_${EDITION_DATE}" --workflow "Daily"

      # --------------------------------------------------------------------- #
      # Notifications
      # --------------------------------------------------------------------- #
      - name: Notify success (Telegram)
        if: ${{ false }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Daily pipeline succeeded
            Date: ${{ github.event.inputs.date || 'today' }}
            Run: #${{ github.run_number }}

      - name: Notify failure (Telegram)
        if: ${{ false }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Daily pipeline FAILED
            Run: #${{ github.run_number }}
            Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
