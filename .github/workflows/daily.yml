name: Daily Current Affairs

permissions:
  contents: write

on:
  schedule:
    - cron: '30 0 * * *'   # EXACTLY 06:00 IST (00:30 UTC) daily
  workflow_dispatch:
    inputs:
      date:
        description: 'Date YYYY-MM-DD (default today IST)'
        required: false

concurrency:
  group: current-affairs-daily
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity (for state commits)
        run: |
          git config user.name "AgriLearningPointBot"
          git config user.email "bot@agrilearningpoint.local"

      - name: Run daily pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TZ: Asia/Kolkata
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then DATE=$(TZ=Asia/Kolkata date +%F); fi
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          python main.py --type daily --date "$DATE"

      - name: Sync persistent event DB (memory / published events / job mirror)
        if: always()
        # P0 FIX: state push MUST fail workflow on 403/merge failure (was warning → hid 403)
        # GitHub docs: workflows need explicit contents: write or push gets 403
        run: |
          python -c "import sys; sys.path.insert(0,'.'); from pipeline import store; store.pull(); store.push('state: daily ${{ env.DATE }}')" 

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-${{ env.DATE }}
          path: |
            output/
            data/
            logs/
          if-no-files-found: warn
