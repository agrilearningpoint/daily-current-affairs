name: Daily News Pipeline

on:
  schedule:
    # 02:00 UTC = 07:30 IST daily
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Override date (YYYY-MM-DD). Default: today IST."
        required: false
        type: string
      allow_revision:
        description: 'Explicitly approve publishing a corrected PDF for an already-published edition (does not override uncertain sends)'
        required: false
        type: boolean
        default: false
      reset:
        description: "Reset job state and re-run from scratch?"
        required: false
        type: boolean
        default: false
      debug:
        description: "Enable debug logging?"
        required: false
        type: boolean
        default: false

      dry_run:
        description: "Dry run only: do not send Telegram messages or publish live."
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  PYTHON_VERSION: "3.11"
  ALP_STAGE_TIMEOUT: "900"
  ALP_MAX_RETRIES: "2"
  LOG_LEVEL: ${{ github.event.inputs.debug == 'true' && 'DEBUG' || 'INFO' }}

jobs:
  run-daily:
    name: Run Daily Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Hindi shaping runtime
        run: sudo apt-get update && sudo apt-get install -y libfribidi0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Prepare directories
        run: |
          mkdir -p logs state/locks state/metrics \
                   data/raw data/verified data/jobs data/dedup \
                   data/scored data/selected data/content data/mcq \
                   data/memory output

      - name: Resolve edition and previous checkpoint run
        id: edition
        env:
          REQUESTED_DATE: ${{ github.event.inputs.date }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, date
          from pathlib import Path
          from zoneinfo import ZoneInfo
          value = os.environ.get("REQUESTED_DATE", "").strip() or datetime.now(ZoneInfo("Asia/Kolkata")).strftime("%Y-%m-%d")
          date.fromisoformat(value)
          job_id = f"daily_{value}"
          data = json.loads(Path("state/jobs.json").read_text()) if Path("state/jobs.json").exists() else {}
          job = data.get("jobs", data).get(job_id, {})
          run_id = str(job.get("checkpoint_run_id") or job.get("github_run_id", ""))
          with open(os.environ["GITHUB_ENV"], "a") as handle:
              handle.write(f"EDITION_DATE={value}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"previous_run={run_id if run_id.isdigit() else ''}\n")
          PY

      - name: Restore prior edition checkpoints
        if: steps.edition.outputs.previous_run != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pipeline-checkpoints
          run-id: ${{ steps.edition.outputs.previous_run }}
          github-token: ${{ github.token }}
          path: .

      - name: Persist start marker for hard-interruption recovery
        env:
          STATE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import os
          from main import job_context_env, load_jobs_state, update_job, STAGES_BY_TYPE, ROOT
          from pipeline.checkpoints import resume_after
          ctx = job_context_env("daily", os.environ["EDITION_DATE"])
          job = load_jobs_state(strict=True).get(ctx["ALP_JOB_ID"], {})
          names = [stage[0] for stage in STAGES_BY_TYPE["daily"]]
          if job.get("status") != "success" or resume_after(ROOT, ctx["ALP_JOB_ID"], job, names) != names[-1]:
              if job.get("window", {}).get("start") and job.get("window", {}).get("end"):
                  ctx["ALP_WINDOW_START"] = job["window"]["start"]
                  ctx["ALP_WINDOW_END"] = job["window"]["end"]
              update_job(ctx["ALP_JOB_ID"], status="running", context=ctx, record_attempt=False)
          PY
          python scripts/sync_state.py --branch "$STATE_BRANCH" --message "state: daily started"

      - name: Run daily pipeline
        id: pipeline
        env:
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EDITION_DATE: ${{ env.EDITION_DATE }}
          RESET_REQUEST: ${{ github.event.inputs.reset }}
          MIN_CONFIDENCE_THRESHOLD: "0.3"
          MIN_VERIFIED_COUNT: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-4o-mini' }}
          ALP_ALLOW_EDITION_REVISION: ${{ github.event.inputs.allow_revision == 'true' && '1' || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: |
          ARGS=(--job-type daily --date "$EDITION_DATE")
          if [ "$RESET_REQUEST" = "true" ]; then ARGS+=(--reset); fi
          python main.py "${ARGS[@]}"

      - name: Save edition checkpoints (always)
        id: checkpoint_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-checkpoints
          path: |
            data/
            output/
            logs/qa/
          retention-days: 30
          overwrite: true
          if-no-files-found: warn

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-logs-${{ github.run_id }}
          path: |
            logs/
            state/metrics/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-state-${{ github.run_id }}
          path: |
            state/jobs.json
            recovery_plan.json
            output/
            data/
          retention-days: 30
          if-no-files-found: warn

      # --------------------------------------------------------------------- #
      # Conflict-safe state commit
      # --------------------------------------------------------------------- #
      - name: Record uploaded checkpoint reference
        if: always() && steps.checkpoint_upload.outputs.artifact-id != ''
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from main import load_jobs_state, save_jobs_state, JOBS_STATE_PATH
          from pipeline.persistence import file_lock
          job_id = "daily_" + os.environ["EDITION_DATE"]
          with file_lock(JOBS_STATE_PATH.parent / "locks" / "state.lock"):
              jobs = load_jobs_state(strict=True)
              if job_id in jobs:
                  jobs[job_id]["checkpoint_run_id"] = os.environ["GITHUB_RUN_ID"]
                  jobs[job_id]["updated_at"] = datetime.now(timezone.utc).isoformat()
                  save_jobs_state(jobs)
          PY

      - name: Commit state changes
        if: always()
        env:
          STATE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/sync_state.py --branch "$STATE_BRANCH" --message "state: daily checkpoint"

      # --------------------------------------------------------------------- #
      # Notifications
      # --------------------------------------------------------------------- #
      - name: Notify success (Telegram)
        if: success() && github.event.inputs.dry_run != 'true' 
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Daily pipeline succeeded
            Date: ${{ github.event.inputs.date || 'today' }}
            Run: #${{ github.run_number }}

      - name: Notify failure (Telegram)
        if: failure() && github.event.inputs.dry_run != 'true' 
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Daily pipeline FAILED
            Run: #${{ github.run_number }}
            Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
