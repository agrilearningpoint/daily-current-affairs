name: Weekly Current Affairs

on:
  schedule:
    - cron: '30 0 * * 0'   # Sunday EXACTLY 06:00 IST — weekly ONLY (daily.yml runs its own daily edition)
  workflow_dispatch: {}

concurrency:
  group: current-affairs-weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - name: Configure git identity
        run: |
          git config user.name "AgriLearningPointBot"
          git config user.email "bot@agrilearningpoint.local"
      - name: Run weekly pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          TZ: Asia/Kolkata
        run: |
          DATE=$(TZ=Asia/Kolkata date +%F)
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          python main.py --type weekly --date "$DATE"
      - name: Sync persistent event DB
        if: always()
        run: |
          git add -f state/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "state: weekly ${{ env.DATE }}"
          git pull --rebase origin main || true
          git push origin HEAD:main || echo "::warning::state push failed (non-blocking)"
      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ env.DATE }}
          path: |
            output/
            data/
            logs/
          if-no-files-found: warn
