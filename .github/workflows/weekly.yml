name: Weekly Current Affairs

on:
  schedule:
    - cron: '15 0 * * 0'   # Sunday 06:00 IST — weekly ONLY; the normal daily.yml still runs its own daily edition
  workflow_dispatch: {}

concurrency:
  group: current-affairs-weekly
  cancel-in-progress: false

# FIX: removed the extra `python main.py --type daily` step that caused a duplicate
# daily run racing with daily.yml on Sundays (same time, same job_id).

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - name: Run weekly pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          TZ: Asia/Kolkata
        run: |
          DATE=$(TZ=Asia/Kolkata date +%F)
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          python main.py --type weekly --date "$DATE"
      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ env.DATE }}
          path: |
            output/
            data/
            logs/
          if-no-files-found: warn
