name: Monthly Current Affairs

permissions:
  contents: write

on:
  schedule:
    - cron: '30 0 1 * *'   # 1st of month EXACTLY 06:00 IST — monthly edition covers PREVIOUS complete month
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date YYYY-MM-DD (default first of month IST)'
        required: false
        type: string

concurrency:
  group: current-affairs-monthly
  cancel-in-progress: false

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - name: Configure git identity
        run: |
          git config user.name "AgriLearningPointBot"
          git config user.email "bot@agrilearningpoint.local"
      - name: Run monthly pipeline (previous complete month via collector window logic)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          TZ: Asia/Kolkata
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then DATE=$(TZ=Asia/Kolkata date +%F); fi
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          python main.py --type monthly --date "$DATE"
      - name: Sync persistent event DB + prune old events
        if: always()
        # FIX (audit 2026-10): merge-safe state sync via store.pull()/push();
        # raw `pull --rebase` on concurrently-updated JSON state used to race.
        run: |
          python -c "import sys; sys.path.insert(0,'.'); from pipeline import store; store.prune(); store.pull(); store.push('state: monthly ${{ env.DATE }}')"
      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-${{ env.DATE }}
          path: |
            output/
            data/
            logs/
          if-no-files-found: warn
