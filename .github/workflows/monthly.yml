name: Monthly Current Affairs

on:
  schedule:
    - cron: '15 0 1 * *'   # 1st of month 06:00 IST — monthly ONLY
  workflow_dispatch: {}

concurrency:
  group: current-affairs-monthly
  cancel-in-progress: false

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - name: Run monthly pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          TZ: Asia/Kolkata
        run: |
          DATE=$(TZ=Asia/Kolkata date +%F)
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          python main.py --type monthly --date "$DATE"
      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-${{ env.DATE }}
          path: |
            output/
            data/
            logs/
          if-no-files-found: warn
