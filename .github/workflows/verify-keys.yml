name: Verify Keys
on:
  pull_request:
    paths: ['scripts/verify_keys.py', '.github/workflows/verify-keys.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify secrets (values never printed)
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: python scripts/verify_keys.py
