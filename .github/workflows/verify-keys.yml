name: Verify Keys
on:
  push:
    branches: [verify-keys]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify secrets (values never printed)
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: python scripts/verify_keys.py
