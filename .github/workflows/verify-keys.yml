name: Verify API keys

# Manual only: one tiny real request per secret, printed as a
# NAME | OK/WARN/FAIL/MISSING | http | reason table (values are never printed).
# Sends nothing to Telegram (getMe / getChat only).
on:
  workflow_dispatch: {}

permissions:
  contents: read

# Own group: never queues behind (or blocks) the daily/weekly/monthly pipeline.
concurrency:
  group: verify-keys
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - run: pip install requests

      - name: Verify every secret
        env:
          # Passed explicitly, one by one, by name (never the whole secrets context).
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          LL7_API_KEY: ${{ secrets.LL7_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: |
          # One pass only (each check spends a little free quota); the same
          # table goes to the log and to the run summary.
          echo "## API key verification" >> "$GITHUB_STEP_SUMMARY"
          python scripts/verify_keys.py --markdown | tee -a "$GITHUB_STEP_SUMMARY"
