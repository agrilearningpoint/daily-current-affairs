name: Watchdog

# Real cross-run watchdog: every 5 minutes pulls committed state (state/jobs.json) and
# checks for stalled/FAILED_FINAL jobs. Recovery is executed by the DAILY workflow
# (which has full pipeline deps + secrets); this workflow only detects, alerts and
# commits recovery_plan.json so the next daily run resumes from last_success_stage.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: current-affairs-watchdog
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: true }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - run: pip install requests pytz

      - name: Check all jobs (local + persistent committed state)
        id: wd
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          TZ: Asia/Kolkata
        run: |
          git config user.name "AgriLearningPointBot"
          git config user.email "bot@agrilearningpoint.local"
          set +e
          python main.py --watchdog
          RC=$?
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save recovery plan
        if: steps.wd.outputs.rc != '0'
        env:
          STATE_BRANCH: ${{ github.ref_name }}
        run: |
          python scripts/sync_state.py --branch "$STATE_BRANCH" --message "state: watchdog recovery plan"

      - name: Trigger exact-date recovery
        if: steps.wd.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_REF: ${{ github.ref_name }}
        run: python scripts/recover_jobs.py --ref "$RECOVERY_REF"

      - name: Report state errors or exhausted recovery budget
        if: steps.wd.outputs.rc == '2'
        run: |
          echo "::error::State unreadable or recovery budget exhausted; manual attention required"
          exit 1
