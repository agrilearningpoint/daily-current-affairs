name: Watchdog

# Real cross-run watchdog: every 5 minutes pulls committed state (state/jobs.json) and
# checks for stalled/FAILED_FINAL jobs. Recovery is executed by the DAILY workflow
# (which has full pipeline deps + secrets); this workflow only detects, alerts and
# commits recovery_plan.json so the next daily run resumes from last_success_stage.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: current-affairs-watchdog
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: true }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - run: pip install requests pytz

      - name: Check all jobs (local + persistent committed state)
        id: wd
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          TZ: Asia/Kolkata
        run: |
          git config user.name "AgriLearningPointBot"
          git config user.email "bot@agrilearningpoint.local"
          set +e
          python main.py --watchdog
          RC=$?
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit recovery plan (if problems detected)
        if: steps.wd.outputs.rc == '1'
        run: |
          # FIX (audit 2026-10): merge-safe commit/push via store.push() instead of
          # raw `pull --rebase` (which raced against daily/weekly state commits).
          git add -f recovery_plan.json 2>/dev/null || true
          python -c "import sys; sys.path.insert(0,'.'); from pipeline import store; store.push('watchdog: recovery plan queued')" || echo "::warning::recovery plan push failed"

      - name: Trigger recovery for the FAILED job's own date
        if: steps.wd.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # FIX (audit 2026-10): previously this kicked "Daily Current Affairs" with no
          # input → it rebuilt TODAY's edition instead of resuming the failed one.
          # Now we read recovery_plan.json and trigger each failed job with its exact date.
          python - <<'PY'
          import json, os, re, subprocess
          plan = json.load(open("recovery_plan.json")) if os.path.exists("recovery_plan.json") else []
          WF = {"daily": "Daily Current Affairs", "weekly": "Weekly Current Affairs", "monthly": "Monthly Current Affairs"}
          for jid in plan:
              m = re.match(r"(daily|weekly|monthly)_(\d{4}-\d{2}-\d{2})", jid)
              if not m:
                  continue
              wtype, date = m.group(1), m.group(2)
              cmd = ["gh", "workflow", "run", WF[wtype], "--ref", "main", "-f", f"date={date}"]
              print("recovery trigger:", " ".join(cmd))
              subprocess.run(cmd, check=False)
          PY
